<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Proveedores - Delivery Los Copilot</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Estilos de la página -->
    <link rel="stylesheet" href="login_proveedor.css">
</head>
<body>
    <!-- Fondo decorativo con luces dinámicas -->
    <div class="bg-decorations">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
    </div>

    <main class="login-container">
        <!-- Logo y cabecera de la app -->
        <header class="login-header">
            <div class="brand-logo">
                <i class="fa-solid fa-motorcycle logo-icon"></i>
                <span class="brand-text">Los Copilot</span>
            </div>
            <h1>Portal de Proveedores</h1>
            <p>Gestiona tu restaurante, tus menús y tus órdenes en tiempo real</p>
        </header>

        <!-- Contenedor del Formulario con efecto Glassmorphic -->
        <section class="auth-card">
            <!-- Tabs para cambiar de formulario -->
            <div class="auth-tabs">
                <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">
                    <i class="fa-solid fa-right-to-bracket"></i> Iniciar Sesión
                </button>
                <button class="tab-btn" id="tab-register" onclick="switchTab('register')">
                    <i class="fa-solid fa-user-plus"></i> Registrarse
                </button>
            </div>

            <!-- Alertas dinámicas -->
            <div id="alert-box" class="alert-container hide">
                <span id="alert-msg"></span>
                <button class="alert-close" onclick="closeAlert()">&times;</button>
            </div>

            <!-- Formulario de Login -->
            <form id="login-form" class="auth-form" onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label for="login-email">Correo Electrónico</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-envelope input-icon"></i>
                        <input type="email" id="login-email" placeholder="ejemplo@restaurante.com" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="login-password">Contraseña</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="login-password" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="submit-btn">
                    <span>Entrar al Panel</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

            <!-- Formulario de Registro -->
            <form id="register-form" class="auth-form hide" onsubmit="handleRegister(event)">
                <div class="input-group">
                    <label for="reg-name">Nombre Comercial del Restaurante</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-store input-icon"></i>
                        <input type="text" id="reg-name" placeholder="Pizzería Bella Vista" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="reg-email">Correo de Contacto</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-envelope input-icon"></i>
                        <input type="email" id="reg-email" placeholder="admin@pizzeria.com" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="reg-tel">Teléfono</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-phone input-icon"></i>
                        <input type="tel" id="reg-tel" placeholder="2233-4455" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="reg-dir">Dirección Física</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-location-dot input-icon"></i>
                        <input type="text" id="reg-dir" placeholder="Calle Las Palmeras, Local #5" required>
                    </div>
                </div>

                <div class="input-row">
                    <div class="input-group">
                        <label for="reg-dist">Distancia al Centro (km)</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-route input-icon"></i>
                            <input type="number" step="0.1" id="reg-dist" placeholder="2.5" required>
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="reg-time">Tiempo de Entrega (min)</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-clock input-icon"></i>
                            <input type="number" id="reg-time" placeholder="25" required>
                        </div>
                    </div>
                </div>

                <div class="input-group">
                    <label for="reg-password">Contraseña</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="reg-password" placeholder="Mínimo 6 caracteres" minlength="6" required>
                    </div>
                </div>

                <button type="submit" class="submit-btn register-btn">
                    <span>Crear Cuenta</span>
                    <i class="fa-solid fa-store-slash icon-spin hide" id="reg-spinner"></i>
                    <i class="fa-solid fa-check"></i>
                </button>
            </form>
        </section>
    </main>

    <!-- Script de autenticación -->
    <script>
        // Si ya hay un token JWT válido, redirigir directo al dashboard
        if (localStorage.getItem('provider_token')) {
            window.location.href = 'dashboard_proveedor.html';
        }

        // Pestañas dinámicas
        function switchTab(tab) {
            const loginForm = document.getElementById('login-form');
            const regForm = document.getElementById('register-form');
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');

            if (tab === 'login') {
                loginForm.classList.remove('hide');
                regForm.classList.add('hide');
                tabLogin.classList.add('active');
                tabRegister.classList.remove('active');
            } else {
                loginForm.classList.add('hide');
                regForm.classList.remove('hide');
                tabLogin.classList.remove('active');
                tabRegister.classList.add('active');
            }
            closeAlert();
        }

        // Mostrar Alertas
        function showAlert(msg, isSuccess = false) {
            const alertBox = document.getElementById('alert-box');
            const alertMsg = document.getElementById('alert-msg');
            
            alertBox.className = 'alert-container ' + (isSuccess ? 'success' : 'error');
            alertMsg.textContent = msg;
            alertBox.classList.remove('hide');
        }

        function closeAlert() {
            document.getElementById('alert-box').classList.add('hide');
        }

        // POST Login
        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            try {
                const response = await fetch('/api/provider/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    showAlert('¡Inicio de sesión exitoso! Redirigiendo...', true);
                    localStorage.setItem('provider_token', data.token);
                    localStorage.setItem('provider_info', JSON.stringify(data.restaurante));
                    
                    setTimeout(() => {
                        window.location.href = 'dashboard_proveedor.html';
                    }, 1500);
                } else {
                    showAlert(data.message || 'Error en las credenciales.');
                }
            } catch (err) {
                console.error(err);
                showAlert('Error al conectar con el servidor.');
            }
        }

        // POST Registro
        async function handleRegister(e) {
            e.preventDefault();
            const nombre = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const telefono = document.getElementById('reg-tel').value;
            const direccion = document.getElementById('reg-dir').value;
            const distancia_km = parseFloat(document.getElementById('reg-dist').value);
            const tiempo_entrega_min = parseInt(document.getElementById('reg-time').value);
            const password = document.getElementById('reg-password').value;

            try {
                const response = await fetch('/api/provider/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        nombre,
                        direccion,
                        telefono,
                        email,
                        password,
                        distancia_km,
                        tiempo_entrega_min
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    showAlert('¡Registro completado! Por favor, inicia sesión.', true);
                    e.target.reset();
                    setTimeout(() => {
                        switchTab('login');
                    }, 2000);
                } else {
                    showAlert(data.message || 'Error en el registro.');
                }
            } catch (err) {
                console.error(err);
                showAlert('Error al conectar con el servidor.');
            }
        }
    </script>
</body>
</html>
